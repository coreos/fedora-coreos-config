# These are packages that are related to configuring parts of the system.
# It is intended to be kept generic so that it may be shared downstream with
# RHCOS.

packages:
  # Manage and load rules in the audit subsystem in the kernel
  # https://github.com/coreos/fedora-coreos-tracker/issues/1362
  - audit
  # Configuring SSH keys, cloud provider check-in, etc
  - afterburn afterburn-dracut
  # NTP support
  - chrony
  # Installing CoreOS itself
  - coreos-installer coreos-installer-bootinfra
  # Storage configuration/management
  ## cloud-utils-growpart - For growing root partition
  - cifs-utils
  - cloud-utils-growpart
  - device-mapper-multipath
  - iscsi-initiator-utils
  - mdadm
  - sg3_utils
  # User configuration
  - shadow-utils
  - acl
  # There are things that write outside of the journal still (such as the
  # classic wtmp, etc.). auditd also writes outside the journal but it has its
  # own log rotation.
  # Anything package layered will also tend to expect files dropped in
  # /etc/logrotate.d to work. Really, this is a legacy thing, but if we don't
  # have it then people's disks will slowly fill up with logs.
  - logrotate
  # Boost starving threads
  # https://github.com/coreos/fedora-coreos-tracker/issues/753
  - stalld
  # we need dmsquash-live dracut module to create the live iso
  # in image-builder.
  - dracut-live
  # erofs-utils provides mkfs.erofs, needed by osbuild when building live ISOs
  - erofs-utils
  # python is needed by osbuild runners
  - python3
  # grub2-efi-x64-cdboot provides gcdx64.efi needed by osbuild's grub2.iso
  # stage when building live ISOs
  - shim
  - grub2-efi-*-cdboot
  - grub2-efi-x64-cdboot
  - xorriso
  - isomd5sum

conditional-include:
  # numad is not available for s390x
  - if: basearch != "s390x"
    include:
      packages:
        # https://github.com/coreos/fedora-coreos-tracker/issues/2096
        # numad: Daemon that provides placement advice for efficient use of CPUs and memory on systems with NUMA topology.
        # numactl: Control NUMA policy for processes or shared memory
        - numad
        - numactl

postprocess:
  # Mask systemd-repart. Ignition is responsible for partition setup on first
  # boot and does not use systemd-repart currently. See also
  # https://github.com/coreos/fedora-coreos-tracker/issues/570
  - |
    #!/usr/bin/bash
    set -eux -o pipefail
    systemctl mask systemd-repart.service
  # shim and grub2-efi-x64-cdboot install EFI binaries into /usr/lib/efi/
  # but mark /boot/efi/EFI/ entries as ghost (not present in the container
  # filesystem). osbuild's grub2.iso stage expects files under
  # /boot/efi/EFI/fedora/, so populate that directory with symlinks to the
  # real files from both /usr/lib/efi/shim/ and /usr/lib/efi/grub2/.
  - |
    #!/usr/bin/bash
    set -eux -o pipefail
    mkdir -p /boot/efi/EFI/fedora
    for f in /usr/lib/efi/shim/*/EFI/fedora/* /usr/lib/efi/grub2/*/EFI/fedora/*; do
      ln -sfn "${f}" /boot/efi/EFI/fedora/"$(basename "${f}")"
    done
  # Disable composefs for ostree as it is incompatible with the erofs rootfs
  # used by the bootc-generic-iso pipeline.
  - |
    #!/usr/bin/bash
    set -eux -o pipefail
    printf '[composefs]\nenabled = no\n[sysroot]\nreadonly = false\n' > /usr/lib/ostree/prepare-root.conf
