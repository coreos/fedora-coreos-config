# This file must sort after platform config (e.g. 20-afterburn.conf)
# and before other distro config that may enable password logins
# (e.g. 50-redhat.conf).
# Disable password logins by default.
# https://github.com/coreos/fedora-coreos-tracker/issues/138
PasswordAuthentication no
# The above alone does not block password logins:
# https://github.com/coreos/afterburn/pull/1326#issuecomment-6877216290
# While the below is the default in Fedora:
# https://src.fedoraproject.org/rpms/openssh/blob/f958b13e6aae33a73e98888cc8c03459905972ff/f/0011-openssh-8.7p1-redhat.patch#_116
# We set it explicitly here to not depend on that default, since the goal
# of this file is to ensure that password logins are disabled.
KbdInteractiveAuthentication no
