# Stream-specific build arguments.
# Pass to buildah/podman using `--build-arg-file`.

ID=fedora
NAME=fedora-coreos
STREAM=rawhide
DESCRIPTION=Fedora CoreOS rawhide
VERSION=46
MUTATE_OS_RELEASE=46
BUILDER_IMG=quay.io/bootc-devel/fedora-bootc-rawhide-standard@sha256:bee19df56466a5e34bb2d9003ab0bddea52d757cd4b50d4610ba464deefe9010
MANIFEST=manifest.yaml
# XXX: see inject_passwd_group() in build-rootfs
PASSWD_GROUP_DIR=manifests
IMAGE_CONFIG=image.yaml
# Use chunkah for chunking and also set the number of
# layers to something high to increase the chances of
# one SRPM per layer granularity.
#
# From memory the upper limit on layers is around ~500. Set
# it to 400 here to see if we find any limitiations anywhere.
BUILDER_IMG_CHUNKER=chunkah
BUILDER_IMG_CHUNKER_MAX_LAYERS=400
MAINTAINER=Fedora Linux
VENDOR=Fedora Linux
URL=https://github.com/coreos/fedora-coreos-config
DISTRIBUTION_SCOPE=public
COMPONENT=fedora-coreos-rawhide
CPE_NAME=cpe:/o:fedoraproject:fedora:46
