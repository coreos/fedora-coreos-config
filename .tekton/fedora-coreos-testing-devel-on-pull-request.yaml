apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/coreos/fedora-coreos-config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "testing-devel"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: fedora-coreos-testing-devel
    appstudio.openshift.io/component: fedora-coreos-testing-devel
    pipelines.appstudio.openshift.io/type: build
  name: fedora-coreos-testing-devel-on-pull-request
  namespace: coreos-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/konflux-fedora/coreos-tenant/fedora-coreos-testing-devel:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Containerfile
  - name: path-context
    value: .
  - name: privileged-nested
    value: true
  - name: build-args
    value: ["VERSION=42", "BUILDER_IMG=quay.io/fedora/fedora-bootc:42", "MANIFEST=manifest.yaml", "PASSWD_GROUP_DIR=manifests"]
  # This is required until https://github.com/containers/buildah/issues/5952 is fixed
  # For now we are using this workaround https://github.com/konflux-ci/buildah-container/issues/134
  - name: workingdir-mount
    value: "/run/src"
  pipelineRef:
    params:
    - name: bundle
      value: quay.io/bootc/tekton-catalog/pipeline-buildah-build-bootc-multi-platform-oci-ta@sha256:5cd05ed32a5f547459a6816eae31b215defeb16df5455292182ef6180d3cd9e0
    - name: name
      value: buildah-build-bootc-multi-platform-oci-ta
    - name: kind
      value: pipeline
    resolver: bundles
  taskRunTemplate:
    serviceAccountName: build-pipeline-fedora-coreos-testing-devel
